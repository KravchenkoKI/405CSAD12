name: cross_build

on:
  push:
    branches:
      - '**develop**'
      - '**master**'
  pull_request:
    branches:
      - '**develop**'
      - '**master**'

jobs:
  cross_build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up MSVC (Windows only)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Build and test on Linux and macOS
        if: runner.os != 'Windows'
        run: |
          chmod +x ./ci.sh
          ./ci.sh

      - name: Build and test on Windows
        if: runner.os == 'Windows'
        shell: cmd
        run: ci.bat

      - name: Upload hello on Linux and macOS
        if: runner.os != 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: hello-${{ matrix.os }}
          path: build/hello
          if-no-files-found: warn

      - name: Upload hello on Windows
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: hello-${{ matrix.os }}
          path: |
            build/Release/hello.exe
            build/hello.exe
          if-no-files-found: warn